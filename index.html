<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DELOGO SYSTEM</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--sur:#0c0c0c;--red:#ff2d00;--amb:#ffaa00;--grn:#00ff88;--txt:#eee}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:'Share Tech Mono',monospace;padding:20px;margin:0}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.15) 2px,rgba(0,0,0,.15) 4px);pointer-events:none;z-index:999}
.wrap{max-width:500px;margin:0 auto}
header{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:5px;text-align:center;margin-bottom:30px;color:var(--red);text-shadow:0 0 10px rgba(255,45,0,0.5)}
.sec{background:var(--sur);border:1px solid #222;padding:20px;margin-bottom:15px;box-shadow:5px 5px 0 rgba(0,0,0,0.5)}
.tag{font-family:'Bebas Neue';font-size:14px;color:var(--amb);margin-bottom:10px;letter-spacing:2px}
input{width:100%;background:#000;border:1px solid #333;color:#fff;padding:15px;outline:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
button{width:100%;padding:20px;border:none;background:var(--red);color:#fff;font-family:'Bebas Neue';font-size:18px;letter-spacing:3px;cursor:pointer;margin-top:10px}
button:hover{background:var(--txt);color:#000}
#btnP{background:transparent;border:1px solid #555;color:#888}
#btnDL{background:var(--grn);color:#000;display:none}
#pbf{height:4px;background:#222;width:100%;margin-top:20px}
#bar{height:100%;background:var(--red);width:0%}
canvas{width:100%;margin-top:20px;border:1px solid #333;display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>DELOGO SYSTEM</header>
  <div class="sec">
    <div class="tag">// UPLOAD</div>
    <input type="file" id="fi" accept="video/*">
  </div>
  <div class="sec">
    <div class="tag">// COORDS</div>
    <div class="g2">
      <input type="number" id="cx" value="1145">
      <input type="number" id="cy" value="585">
      <input type="number" id="cw" value="75">
      <input type="number" id="ch" value="75">
    </div>
  </div>
  <div class="sec">
    <button id="btnP">PREVIEW</button>
    <button id="btnR">PROCESS</button>
    <div id="pbf"><div id="bar"></div></div>
    <canvas id="cvs"></canvas>
  </div>
  <div class="sec">
    <button id="btnDL">DOWNLOAD</button>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const fi=$('fi'),cvs=$('cvs'),btnDL=$('btnDL'),bar=$('bar');
let blob=null;
btnDL.onclick=()=>{if(!blob)return;const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fixed.mp4';a.click();};
$('btnP').onclick=()=>{
  if(!fi.files[0])return;
  const v=document.createElement('video');
  v.src=URL.createObjectURL(fi.files[0]);
  v.onloadedmetadata=()=>{
    cvs.width=v.videoWidth; cvs.height=v.videoHeight;
    cvs.style.display='block';
    const ctx=cvs.getContext('2d');
    v.currentTime=1;
    v.onseeked=()=>{
      ctx.drawImage(v,0,0);
      ctx.strokeStyle= '#ff2d00';
      ctx.lineWidth=4;
      ctx.strokeRect(1145, 585, 75, 75);
    };
  };
};
$('btnR').onclick=async()=>{
  const file=fi.files[0];
  if(!file)return;
  btnDL.style.display='none';
  const v=document.createElement('video');
  v.src=URL.createObjectURL(file);
  await v.play();
  const c=document.createElement('canvas');
  c.width=v.videoWidth; c.height=v.videoHeight;
  const ctx=c.getContext('2d');
  const ac=new AudioContext();
  const dst=ac.createMediaStreamDestination();
  ac.createMediaElementSource(v).connect(dst);
  const stream=c.captureStream(30);
  stream.addTrack(dst.stream.getAudioTracks()[0]);
  const rec=new MediaRecorder(stream, {mimeType: 'video/mp4;codecs=avc1.424028,mp4a.40.2'});
  const ch=[];
  rec.ondataavailable=e=>ch.push(e.data);
  rec.onstop=()=>{blob=new Blob(ch,{type:'video/mp4'});btnDL.style.display='block';};
  rec.start();
  const x=1145, y=585, w=75, h=75;
  function dr(){
    if(v.paused||v.ended){rec.stop();return;}
    ctx.drawImage(v,0,0);
    const n = ctx.getImageData(x+w, y, w, h);
    ctx.putImageData(n, x, y);
    ctx.globalAlpha = 0.5;
    ctx.drawImage(c, x-w, y, w, h, x, y, w, h);
    ctx.globalAlpha = 1.0;
    bar.style.width=(v.currentTime/v.duration*100)+'%';
    requestAnimationFrame(dr);
  }
  dr();
};
</script>
</body>
</html>
